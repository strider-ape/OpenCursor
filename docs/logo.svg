<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>OpenCursor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB36B"/>
      <stop offset="0.5" stop-color="#FD746C"/>
      <stop offset="1" stop-color="#E0457B"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Path from the thumb pad up to the cursor -->
  <path d="M352 360 Q 300 250 196 196" fill="none" stroke="#FFFFFF" stroke-opacity="0.55"
        stroke-width="14" stroke-linecap="round" stroke-dasharray="2 30"/>

  <!-- Thumb pad (bottom right) -->
  <circle cx="360" cy="372" r="62" fill="#FFFFFF" fill-opacity="0.28"/>
  <circle cx="360" cy="372" r="62" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="8"/>

  <!-- Cursor (top left): ring with a centre dot -->
  <circle cx="176" cy="176" r="74" fill="#1C1B22" fill-opacity="0.12"/>
  <circle cx="176" cy="176" r="74" fill="none" stroke="#FFFFFF" stroke-width="22"/>
  <circle cx="176" cy="176" r="20" fill="#FFFFFF"/>
</svg>
