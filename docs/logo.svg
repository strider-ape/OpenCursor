<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>OpenCursor</title>
  <rect width="512" height="512" rx="116" fill="#FD746C"/>
  <!-- Straight dotted path from the thumb pad up to the cursor -->
  <path d="M290 296 L 206 210" fill="none" stroke="#FFFFFF" stroke-opacity="0.7"
        stroke-width="22" stroke-linecap="round" stroke-dasharray="2 34"/>
  <!-- Big thumb pad (bottom right) -->
  <circle cx="362" cy="368" r="98" fill="#FFFFFF" fill-opacity="0.26"/>
  <circle cx="362" cy="368" r="98" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="10"/>
  <!-- Cursor (top left): ring with a centre dot -->
  <circle cx="142" cy="142" r="70" fill="#1C1B22" fill-opacity="0.14"/>
  <circle cx="142" cy="142" r="70" fill="none" stroke="#FFFFFF" stroke-width="22"/>
  <circle cx="142" cy="142" r="19" fill="#FFFFFF"/>
</svg>
